name: Release (Windows & macOS)

on:
  push:
    tags:
      - "v*.*.*"
  release:
    types:
      - published

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-release:
    name: Build & Publish (${{ matrix.platform }})
    if: ${{ github.event_name == 'push' }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"

    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches Cargo workspace version
        shell: bash
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          CARGO_VER=$(grep -m1 '^version = "' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')
          echo "Tag version: $TAG_VER | Cargo.toml version: $CARGO_VER"
          if [ "$TAG_VER" != "$CARGO_VER" ]; then
            echo "::error::Git tag $GITHUB_REF_NAME does not match Cargo.toml workspace version $CARGO_VER."
            exit 1
          fi

      - name: Verify updater signing configuration
        shell: bash
        env:
          HAS_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          HAS_PUBLIC_KEY: ${{ vars.FR_UPDATER_PUBKEY != '' }}
        run: |
          if [ "$HAS_PRIVATE_KEY" != "$HAS_PUBLIC_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY (secret) and FR_UPDATER_PUBKEY (repo variable) must either BOTH be configured or BOTH be empty."
            exit 1
          fi

      - name: Prepare updater config overlay (when signing is configured)
        if: ${{ vars.FR_UPDATER_PUBKEY != '' }}
        shell: bash
        env:
          FR_UPDATER_PUBKEY: ${{ vars.FR_UPDATER_PUBKEY }}
        run: |
          node -e '
            const fs = require("fs");
            const path = "apps/desktop/src-tauri/tauri.updater.conf.json";
            const cfg = JSON.parse(fs.readFileSync(path, "utf8"));
            cfg.plugins = cfg.plugins || {};
            cfg.plugins.updater = {
              pubkey: process.env.FR_UPDATER_PUBKEY.trim(),
              windows: { installMode: "passive" },
            };
            fs.writeFileSync(path, JSON.stringify(cfg, null, 2) + "\n");
          '

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop/ui
        run: npm ci

      - name: Verify Rust tests before packaging
        run: cargo test --workspace

      # Publishes a draft GitHub Release (D2: human writes release notes & publishes
      # the draft after QA, which triggers finalize-release again to sync notes into latest.json).
      - name: Build & release Tauri installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FR_DEFAULT_NEXTCLOUD_URL: ${{ vars.FR_DEFAULT_NEXTCLOUD_URL }}
          FR_UPDATER_PUBKEY: ${{ vars.FR_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Optional Apple Developer ID signing & notarization secrets (macOS — best-effort unsigned when unset)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop/src-tauri
          tagName: v__VERSION__
          releaseName: "FR Universal App v__VERSION__"
          releaseBody: "Cross-platform Windows (NSIS per-user setup) and macOS universal (.dmg) release."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: ${{ vars.FR_UPDATER_PUBKEY != '' }}
          args: ${{ matrix.args }} ${{ vars.FR_UPDATER_PUBKEY != '' && '--config tauri.updater.conf.json' || '' }}

  finalize-release:
    name: Verify & Merge Updater Manifest
    needs: publish-release
    if: ${{ always() && vars.FR_UPDATER_PUBKEY != '' && (needs.publish-release.result == 'success' || (github.event_name == 'release' && needs.publish-release.result == 'skipped')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify latest.json and merge platform signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          node -e '
            const { execFileSync } = require("child_process");
            const fs = require("fs");
            const tag = process.env.TAG_NAME;
            const repo = process.env.REPO;
            const version = tag.replace(/^v/, "");

            // Draft releases are not returned by /releases/tags/{tag}; list releases instead.
            const releasesJson = execFileSync(
              "gh",
              ["api", `/repos/${repo}/releases?per_page=100`],
              { encoding: "utf8" }
            );
            const releases = JSON.parse(releasesJson);
            const release = releases.find((r) => r.tag_name === tag);
            if (!release) {
              throw new Error(`Could not find draft or published release for tag ${tag}.`);
            }
            const assets = release.assets || [];

            const byName = new Map(assets.map((a) => [a.name, a]));
            const sigAssets = assets.filter((a) => a.name.endsWith(".sig"));
            if (sigAssets.length === 0) {
              throw new Error("No .sig updater signature assets were uploaded to the release.");
            }

            const readAssetText = (asset) =>
              execFileSync(
                "gh",
                ["api", "-H", "Accept: application/octet-stream", `/repos/${repo}/releases/assets/${asset.id}`],
                { encoding: "utf8" }
              ).trim();

            const platforms = {};
            for (const sigAsset of sigAssets) {
              const bundleName = sigAsset.name.slice(0, -4);
              const bundleAsset = byName.get(bundleName);
              if (!bundleAsset) {
                throw new Error(`Signature ${sigAsset.name} has no matching bundle asset ${bundleName}`);
              }
              const signature = readAssetText(sigAsset);
              const entry = {
                signature,
                url: bundleAsset.browser_download_url,
              };
              const lower = bundleName.toLowerCase();
              if (lower.endsWith("-setup.exe")) {
                platforms["windows-x86_64"] = entry;
              } else if (lower.endsWith(".app.tar.gz")) {
                platforms["darwin-aarch64"] = entry;
                platforms["darwin-x86_64"] = entry;
              }
            }

            if (!platforms["windows-x86_64"]) {
              throw new Error("Merged latest.json is missing windows-x86_64 (-setup.exe) entry.");
            }
            if (!platforms["darwin-aarch64"] || !platforms["darwin-x86_64"]) {
              throw new Error("Merged latest.json is missing macOS (.app.tar.gz) entries.");
            }

            const manifest = {
              version,
              notes: release.body || "",
              pub_date: release.published_at || new Date().toISOString(),
              platforms,
            };
            fs.writeFileSync("latest.json", JSON.stringify(manifest, null, 2) + "\n");
            console.log("Verified merged latest.json:", JSON.stringify({ version, platforms: Object.keys(platforms) }));

            const existingManifest = byName.get("latest.json");
            if (existingManifest) {
              execFileSync(
                "gh",
                ["api", "-X", "DELETE", `/repos/${repo}/releases/assets/${existingManifest.id}`],
                { stdio: "inherit" }
              );
            }
            execFileSync(
              "gh",
              [
                "api",
                "--method",
                "POST",
                "-H",
                "Content-Type: application/json",
                "--input",
                "latest.json",
                `https://uploads.github.com/repos/${repo}/releases/${release.id}/assets?name=latest.json`,
              ],
              { stdio: "inherit" }
            );
          '
