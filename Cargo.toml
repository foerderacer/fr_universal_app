[workspace]
resolver = "2"
members = [
  "crates/fr-core",
  "crates/fr-storage",
  "crates/fr-nextcloud",
  "crates/fr-preview",
  "crates/fr-mcp",
  "crates/fr-workflows",
  "crates/fr-talk",
  "crates/fr-slicer",
  "crates/modules/fr-mod-files",
  "crates/modules/fr-mod-finance",
  "crates/modules/fr-mod-automation",
  "crates/modules/fr-mod-talk",
  "crates/modules/fr-mod-slicer",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[workspace.dependencies]
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
cfb = "0.14"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
keyring = { version = "3.6", features = ["apple-native", "windows-native"] }
percent-encoding = "2.3"
quick-xml = "0.42"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "json", "http2", "charset", "system-proxy"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
specta = { version = "=2.0.0-rc.28", features = ["derive", "chrono"] }
specta-typescript = "=0.0.15"
subtle = "2.6"
tauri = { version = "2", default-features = false, features = ["wry", "compression", "dynamic-acl", "x11", "dbus"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "fs", "io-util", "time", "net", "process"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
wiremock = "0.6"

# Internal workspace crates
fr-core = { path = "crates/fr-core" }
fr-storage = { path = "crates/fr-storage" }
fr-nextcloud = { path = "crates/fr-nextcloud" }
fr-preview = { path = "crates/fr-preview" }
fr-mcp = { path = "crates/fr-mcp" }
fr-workflows = { path = "crates/fr-workflows" }
fr-talk = { path = "crates/fr-talk" }
fr-slicer = { path = "crates/fr-slicer" }
fr-mod-files = { path = "crates/modules/fr-mod-files" }
fr-mod-finance = { path = "crates/modules/fr-mod-finance" }
fr-mod-automation = { path = "crates/modules/fr-mod-automation" }
fr-mod-talk = { path = "crates/modules/fr-mod-talk" }
fr-mod-slicer = { path = "crates/modules/fr-mod-slicer" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
