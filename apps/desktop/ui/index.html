<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FR Universal App</title>
    <script>
      try {
        var t = window.localStorage.getItem("fr.workspace.theme.v1");
        var dark =
          t === "light"
            ? false
            : t === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
              : true;
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {}
    </script>
  </head>
  <body class="antialiased selection:bg-[var(--accent)]/30 selection:text-inherit">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
